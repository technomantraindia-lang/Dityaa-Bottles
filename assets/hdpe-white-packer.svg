<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="hdpeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="25%" stop-color="#f1f5f9"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="hdpeCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="shadowG3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(4,43,75,0.3)"/>
      <stop offset="100%" stop-color="rgba(4,43,75,0)"/>
    </radialGradient>
  </defs>
  <ellipse cx="200" cy="450" rx="105" ry="20" fill="url(#shadowG3)"/>
  
  <!-- Solid White HDPE Body -->
  <rect x="120" y="145" width="160" height="285" rx="18" fill="url(#hdpeGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Pharma label graphic mockup -->
  <rect x="135" y="210" width="130" height="150" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="145" y="225" width="70" height="8" rx="2" fill="#0284c7"/>
  <rect x="145" y="240" width="110" height="4" rx="1" fill="#94a3b8"/>
  <rect x="145" y="248" width="90" height="4" rx="1" fill="#cbd5e1"/>
  <!-- Rx medical cross badge -->
  <circle cx="235" cy="275" r="14" fill="#00a8b5" opacity="0.15"/>
  <path d="M232,267 h6 v6 h6 v6 h-6 v6 h-6 v-6 h-6 v-6 h6 z" fill="#00a8b5"/>
  <rect x="145" y="325" width="60" height="14" rx="3" fill="#0284c7" opacity="0.2"/>
  <text x="150" y="335" font-family="sans-serif" font-size="8" font-weight="bold" fill="#0369a1">USP / GMP</text>

  <!-- Shoulder -->
  <path d="M120,160 C120,120 160,110 165,110 L235,110 C240,110 280,120 280,160 Z" fill="url(#hdpeGrad)" stroke="#cbd5e1"/>
  <rect x="165" y="70" width="70" height="42" fill="url(#hdpeGrad)" stroke="#cbd5e1"/>
  
  <!-- Wide-Mouth CRC Ribbed Cap -->
  <rect x="150" y="32" width="100" height="44" rx="6" fill="url(#hdpeCap)" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Cap Grip Ribs -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="160" y1="40" x2="160" y2="70"/>
    <line x1="170" y1="40" x2="170" y2="70"/>
    <line x1="180" y1="40" x2="180" y2="70"/>
    <line x1="190" y1="40" x2="190" y2="70"/>
    <line x1="200" y1="40" x2="200" y2="70"/>
    <line x1="210" y1="40" x2="210" y2="70"/>
    <line x1="220" y1="40" x2="220" y2="70"/>
    <line x1="230" y1="40" x2="230" y2="70"/>
    <line x1="240" y1="40" x2="240" y2="70"/>
  </g>
  <rect x="155" y="72" width="90" height="5" rx="2" fill="#e2e8f0"/>

  <!-- Soft Highlight -->
  <rect x="138" y="150" width="14" height="270" rx="7" fill="rgba(255,255,255,0.7)"/>
</svg>