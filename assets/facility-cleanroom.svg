<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042b4b"/>
      <stop offset="50%" stop-color="#06385f"/>
      <stop offset="100%" stop-color="#02182b"/>
    </linearGradient>
    <linearGradient id="glowTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a8b5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  
  <!-- Cleanroom ceiling HEPA filter grid -->
  <g stroke="rgba(56,189,248,0.2)" stroke-width="1.5">
    <line x1="50" y1="40" x2="550" y2="40"/>
    <line x1="50" y1="80" x2="550" y2="80"/>
    <line x1="120" y1="20" x2="120" y2="90"/>
    <line x1="200" y1="20" x2="200" y2="90"/>
    <line x1="280" y1="20" x2="280" y2="90"/>
    <line x1="360" y1="20" x2="360" y2="90"/>
    <line x1="440" y1="20" x2="440" y2="90"/>
    <line x1="520" y1="20" x2="520" y2="90"/>
  </g>
  <!-- HEPA Flow vectors -->
  <g stroke="rgba(14,165,233,0.3)" stroke-width="1" stroke-dasharray="4,4">
    <line x1="160" y1="90" x2="160" y2="160"/>
    <line x1="240" y1="90" x2="240" y2="160"/>
    <line x1="320" y1="90" x2="320" y2="160"/>
    <line x1="400" y1="90" x2="400" y2="160"/>
    <line x1="480" y1="90" x2="480" y2="160"/>
  </g>

  <!-- Automated IBM Molding Machinery silhouette -->
  <rect x="80" y="160" width="440" height="190" rx="12" fill="#0b233a" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="100" y="180" width="160" height="120" rx="8" fill="#081827" stroke="rgba(56,189,248,0.4)"/>
  
  <!-- Machine digital control panel / HMI screen -->
  <rect x="115" y="195" width="130" height="80" rx="4" fill="#031b2e" stroke="#00a8b5"/>
  <text x="130" y="215" font-family="monospace" font-size="10" fill="#38bdf8">INJECTION BLOW</text>
  <text x="130" y="230" font-family="monospace" font-size="9" fill="#10b981">● CLASS 100K CLEANROOM</text>
  <text x="130" y="245" font-family="monospace" font-size="8" fill="#94a3b8">CYCLE TIME: 8.4s</text>
  <text x="130" y="260" font-family="monospace" font-size="8" fill="#94a3b8">CAVITY: 16-CAV DITYAA</text>

  <!-- Conveyor & Bottles in Production -->
  <line x1="270" y1="280" x2="500" y2="280" stroke="#38bdf8" stroke-width="4"/>
  <!-- Finished bottles moving along conveyor -->
  <g transform="translate(290, 220) scale(0.25)">
    <rect x="130" y="150" width="140" height="280" rx="30" fill="#d97706"/>
    <rect x="165" y="35" width="70" height="38" rx="5" fill="#ffffff"/>
  </g>
  <g transform="translate(340, 220) scale(0.25)">
    <rect x="130" y="150" width="140" height="280" rx="30" fill="#d97706"/>
    <rect x="165" y="35" width="70" height="38" rx="5" fill="#ffffff"/>
  </g>
  <g transform="translate(390, 220) scale(0.25)">
    <rect x="120" y="145" width="160" height="285" rx="18" fill="#ffffff"/>
    <rect x="150" y="32" width="100" height="44" rx="6" fill="#0284c7"/>
  </g>
  <g transform="translate(440, 220) scale(0.25)">
    <rect x="120" y="145" width="160" height="285" rx="18" fill="#ffffff"/>
    <rect x="150" y="32" width="100" height="44" rx="6" fill="#0284c7"/>
  </g>

  <!-- Cleanroom Status Badge -->
  <rect x="360" y="110" width="200" height="36" rx="18" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="380" cy="128" r="6" fill="#10b981"/>
  <text x="395" y="132" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">ISO 7 / CLASS 100K FACILITY</text>
</svg>