<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Background Ambient & Studio Shadows -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#042b4b" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#042b4b" stop-opacity="0.18"/>
      <stop offset="80%" stop-color="#042b4b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#042b4b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="contactShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#021422" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#042b4b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#042b4b" stop-opacity="0"/>
    </radialGradient>

    <!-- Amber PET Body Cylindrical 3D Lighting -->
    <linearGradient id="amberCylinder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c1103"/>
      <stop offset="6%" stop-color="#4a2007"/>
      <stop offset="16%" stop-color="#7c370b"/>
      <stop offset="30%" stop-color="#b45309"/>
      <stop offset="48%" stop-color="#f59e0b"/>
      <stop offset="58%" stop-color="#d97706"/>
      <stop offset="78%" stop-color="#7c370b"/>
      <stop offset="92%" stop-color="#4a2007"/>
      <stop offset="100%" stop-color="#240e02"/>
    </linearGradient>

    <!-- Internal Liquid Glow & Meniscus -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d1502"/>
      <stop offset="15%" stop-color="#692805"/>
      <stop offset="35%" stop-color="#92400e"/>
      <stop offset="52%" stop-color="#d97706"/>
      <stop offset="68%" stop-color="#b45309"/>
      <stop offset="85%" stop-color="#5a2204"/>
      <stop offset="100%" stop-color="#2b0f02"/>
    </linearGradient>

    <!-- Studio Softbox Specular Highlight (Primary Left) -->
    <linearGradient id="softboxLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Studio Softbox Specular Highlight (Rim Right) -->
    <linearGradient id="softboxRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- White Child-Resistant Closure (CRC) Cap Cylindrical Shading -->
    <linearGradient id="crcCapShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cfd8dc"/>
      <stop offset="8%" stop-color="#eceff1"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="80%" stop-color="#e2e8f0"/>
      <stop offset="95%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Cap Top Bevel -->
    <linearGradient id="capTopBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Cap Rib Shadow/Highlight Pair -->
    <linearGradient id="ribHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Ambient & Contact Ground Shadows -->
  <ellipse cx="200" cy="466" rx="95" ry="18" fill="url(#groundShadow)"/>
  <ellipse cx="200" cy="463" rx="65" ry="9" fill="url(#contactShadow)"/>

  <!-- Bottle Base Curve -->
  <path d="M 136 448 C 136 462, 264 462, 264 448 Z" fill="url(#amberCylinder)"/>

  <!-- Main Cylindrical Bottle Body (Boston Round Profile) -->
  <path d="M 136 182 L 136 448 C 136 456, 142 460, 150 460 L 250 460 C 258 460, 264 456, 264 448 L 264 182 Z" fill="url(#amberCylinder)"/>

  <!-- Internal Liquid Body -->
  <path d="M 140 236 L 140 444 C 140 452, 146 455, 153 455 L 247 455 C 254 455, 260 452, 260 444 L 260 236 Z" fill="url(#liquidGrad)" opacity="0.88"/>

  <!-- Liquid Meniscus Arc -->
  <ellipse cx="200" cy="236" rx="60" ry="6" fill="#f59e0b" opacity="0.75"/>
  <ellipse cx="200" cy="235" rx="58" ry="4" fill="#fbbf24" opacity="0.6"/>

  <!-- Smooth Boston Curved Shoulders -->
  <path d="M 136 186 C 136 128, 172 108, 176 108 L 224 108 C 228 108, 264 128, 264 186 Z" fill="url(#amberCylinder)"/>

  <!-- Bottle Neck (Threaded Cylinder) -->
  <rect x="178" y="68" width="44" height="42" fill="url(#amberCylinder)"/>
  <rect x="176" y="98" width="48" height="6" rx="3" fill="url(#amberCylinder)"/>

  <!-- Calibrated Volume Graduation Marks (Micrometer Screen Printed) -->
  <g opacity="0.82">
    <!-- 100 ml -->
    <line x1="144" y1="246" x2="162" y2="246" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="168" y="250" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="0.4">100 ml</text>
    <!-- 80 ml -->
    <line x1="144" y1="280" x2="156" y2="280" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <text x="168" y="284" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.85)">80 ml</text>
    <!-- 60 ml -->
    <line x1="144" y1="314" x2="162" y2="314" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="168" y="318" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="0.4">60 ml</text>
    <!-- 40 ml -->
    <line x1="144" y1="348" x2="156" y2="348" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <text x="168" y="352" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.85)">40 ml</text>
    <!-- 20 ml -->
    <line x1="144" y1="382" x2="162" y2="382" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="168" y="386" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="0.4">20 ml</text>
  </g>

  <!-- Specular Reflection: Primary Vertical Softbox Strip (Left) -->
  <rect x="150" y="180" width="16" height="260" rx="8" fill="url(#softboxLeft)"/>
  <!-- Shoulder Specular Highlight -->
  <path d="M 150 180 C 150 134, 174 116, 184 112" stroke="rgba(255,255,255,0.65)" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- Specular Reflection: Secondary Rim Strip (Right) -->
  <rect x="246" y="184" width="8" height="250" rx="4" fill="url(#softboxRight)"/>
  <path d="M 248 184 C 248 140, 230 118, 218 112" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Bottle Bottom Curvature Specular -->
  <path d="M 152 452 C 180 458, 220 458, 248 452" stroke="rgba(255,255,255,0.35)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- ==================== CHILD-RESISTANT CLOSURE (CRC) CAP ==================== -->
  <!-- Tamper-Evident Safety Ring Collar -->
  <rect x="174" y="70" width="52" height="6" rx="2" fill="url(#crcCapShade)"/>
  <line x1="174" y1="76" x2="226" y2="76" stroke="#94a3b8" stroke-width="1"/>

  <!-- Main CRC Cap Body (White Polypropylene Shell) -->
  <rect x="168" y="32" width="64" height="40" rx="5" fill="url(#crcCapShade)"/>

  <!-- Cap Top Beveled Rim -->
  <rect x="169" y="32" width="62" height="6" rx="3" fill="url(#capTopBevel)"/>

  <!-- Embossed Child-Safety Push & Turn Icons on Cap Top/Front -->
  <g stroke="#64748b" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <!-- Down Arrow (Push) -->
    <line x1="194" y1="36" x2="194" y2="44"/>
    <polyline points="191,41 194,44 197,41"/>
    <!-- Turning Curved Arrow (Turn) -->
    <path d="M 203 43 A 4 4 0 0 1 209 39 L 209 37"/>
    <polyline points="207,38 209,36 211,38"/>
  </g>

  <!-- Precision Vertical Gripping Ribs (Knurling) with Realistic 3D Highlight & Shadow Pairs -->
  <g opacity="0.65">
    <!-- Rib 1 -->
    <line x1="176" y1="44" x2="176" y2="68" stroke="#ffffff" stroke-width="1.4"/>
    <line x1="177.5" y1="44" x2="177.5" y2="68" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Rib 2 -->
    <line x1="183" y1="44" x2="183" y2="68" stroke="#ffffff" stroke-width="1.4"/>
    <line x1="184.5" y1="44" x2="184.5" y2="68" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Rib 3 -->
    <line x1="190" y1="44" x2="190" y2="68" stroke="#ffffff" stroke-width="1.4"/>
    <line x1="191.5" y1="44" x2="191.5" y2="68" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Rib 4 (Center-left) -->
    <line x1="197" y1="44" x2="197" y2="68" stroke="#ffffff" stroke-width="1.4"/>
    <line x1="198.5" y1="44" x2="198.5" y2="68" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Rib 5 (Center-right) -->
    <line x1="204" y1="44" x2="204" y2="68" stroke="#ffffff" stroke-width="1.4"/>
    <line x1="205.5" y1="44" x2="205.5" y2="68" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Rib 6 -->
    <line x1="211" y1="44" x2="211" y2="68" stroke="#ffffff" stroke-width="1.4"/>
    <line x1="212.5" y1="44" x2="212.5" y2="68" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Rib 7 -->
    <line x1="218" y1="44" x2="218" y2="68" stroke="#ffffff" stroke-width="1.4"/>
    <line x1="219.5" y1="44" x2="219.5" y2="68" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Rib 8 -->
    <line x1="224" y1="44" x2="224" y2="68" stroke="#ffffff" stroke-width="1.4"/>
    <line x1="225.5" y1="44" x2="225.5" y2="68" stroke="#94a3b8" stroke-width="1.2"/>
  </g>

  <!-- Cap Lower Lip Shadow -->
  <rect x="169" y="70" width="62" height="2" fill="#64748b" opacity="0.4"/>
</svg>
